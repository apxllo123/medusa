name: Trigger Landing Page Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Landing Page build
        env:
          LP_TRIGGER_DEPLOY_URL: ${{ secrets.LP_TRIGGER_DEPLOY_URL }}
        run: curl --fail-with-body --location --request POST "$LP_TRIGGER_DEPLOY_URL"
