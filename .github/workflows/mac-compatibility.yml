name: Mac Compatibility Test

on:
  push:
    branches:
      - main
      - 'compatibility/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  mac-compatibility:
    name: Test Mac Compatibility (Apple Silicon)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Node type check
        run: yarn typecheck:node

      - name: Web type check
        run: yarn typecheck:web

      - name: Compile native Mac screen observer
        run: node scripts/build-mac-screen-observer.cjs

      - name: Run Mac parity audit
        run: node scripts/mac-parity-audit.cjs

      - name: Run compatibility tests
        run: yarn test --test-name-pattern='MacCompatibility|MacWine|MacSystem|MacGame'

      - name: Build Electron application
        run: yarn build

      - name: Build unpacked macOS application
        run: npx electron-builder --mac --dir

      - name: Audit packaged Mac resources
        run: node scripts/mac-resource-audit.cjs

      - name: Inspect Mac environment
        run: |
          set -euo pipefail
          echo "=== macOS ==="
          sw_vers
          echo ""
          echo "=== Architecture ==="
          uname -m
          echo ""
          echo "=== Apple Silicon capability ==="
          sysctl -n hw.optional.arm64 || true
          echo ""
          echo "=== Rosetta state ==="
          sysctl -n sysctl.proc_translated || true
          echo ""
          echo "=== Xcode / Metal ==="
          xcodebuild -version || true
          xcrun --find metal || true
          xcrun --find gpucapture || true
          xcrun --find gpudebug || true
          echo ""
          echo "=== Game Porting Toolkit candidates ==="
          command -v gameportingtoolkit || true
          command -v game-porting-toolkit || true
          echo ""
          echo "=== Packaged resources ==="
          find dist -maxdepth 5 -type f \( -name 'Medusa' -o -name 'mac-screen-observer' -o -name '7zz' -o -name 'hydra-python-rpc' \) -print 2>/dev/null || true
          echo ""
          echo "=== Mac compatibility source ==="
          find src/main/services/mac-compatibility -maxdepth 2 -type f | sort

      - name: Upload unpacked Mac app
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: medusa-macos-arm64-unpacked
          path: dist/mac-arm64
          if-no-files-found: error

      - name: Upload Mac parity reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-parity-reports
          path: |
            artifacts/mac-parity-audit.json
            artifacts/mac-resource-audit.json
          if-no-files-found: ignore
